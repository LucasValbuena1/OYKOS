services:
  oykos-front:
    build: .
    image: oykos-front:latest
    container_name: oykos-front
    ports:
      - "3000:3000"
    # Variables de Auth0 y Claude (ver .env.example). Si no existe, la app
    # arranca y muestra el aviso de configuración.
    env_file:
      - path: .env.local
        required: false
    restart: unless-stopped
